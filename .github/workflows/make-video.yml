# Makes a Short about your product in GitHub Actions. Copy it into your product's own repo (.github/workflows/):
# Claude Code runs the makable-shorts plugin's make-video skill there, with the repo's code at hand, and --yes, so it
# asks nothing. It records the change by driving Chrome, writes the script, films the intro and the outro with Gemini
# Omni (about $2) or HeyGen, has ElevenLabs or your own voice API on Modal speak the narration, and uploads the video.
# Or, with no avatar, it opens and ends on cards, narrated by Kokoro on the runner (free) or with no voice at all.
#
# Run it from the Actions tab (Make a video, Run workflow) or: gh workflow run make-video.yml -f commits=3f2a9c1
#
# The product's notes come from the repo, .makable-shorts/products/<name>.md: the skill writes them there when you
# first make a video in the repo locally, for you to commit. Nobody can sign in by hand here, so it only records
# products whose notes don't say signed_in: for one that does, the skill stops before recording. Their url has to be
# on the internet: a localhost one is the runner's own, where nothing is running. What a recording teaches the skill
# goes in the notes' recording tips: the notes are uploaded with the video, for you to commit if they changed.
#
# Who films you and who speaks the narration are repository variables (Settings, Secrets and variables, Actions):
#   SHORTS_FILMER              omni (the default) or heygen: clips you film yourself can't be brought in here. Or
#                              none: a product demo with no avatar, which opens and ends on cards, and needs no photo
#   SHORTS_FILMER_VOICE        with heygen: HeyGen's voice to film you in (makable-shorts voices lists them)
#   SHORTS_NARRATOR            elevenlabs (the default), or modal: your own voice API (makable-shorts deploy-voice).
#                              Or with no avatar: kokoro, on the runner, for nothing, or none, for no voice
#   SHORTS_KOKORO_VOICE        with kokoro: its voice (af_heart, am_michael, ...), if not its own for the language
#   GOOGLE_CLOUD_PROJECT       with omni: the Google Cloud project Omni films in (else the service account's)
#   GCP_WORKLOAD_IDENTITY_PROVIDER, GCP_SERVICE_ACCOUNT    with omni, to sign in to Google Cloud with Workload
#                              Identity Federation, with no key file: or the secret GOOGLE_CREDENTIALS instead
#
# Repository secrets it needs:
#   CLAUDE_CODE_OAUTH_TOKEN    claude setup-token (your Claude subscription)
#   GOOGLE_CREDENTIALS         with omni, unless Workload Identity Federation signs in: a service account's JSON key,
#                              with the Vertex AI User role in the project
#   HEYGEN_API_KEY             with heygen
#   ELEVENLABS_API_KEY         with elevenlabs
#   SHORTS_SPEECH_URL, SHORTS_SPEECH_KEY    with modal: what deploy-voice wrote in your .env
#   FACE_URL                   a link to your photo, for an avatar (a secret holds at most 48 KB, too little for it)
#   MUSIC_URL                  (optional) a link to music to play under the video
#   PRODUCT_REPO_TOKEN         (optional) a token that can read the rest of the product's code, if some is in another
#                              private repo (a fine-grained one with Contents: read), for videos from its commits

name: Make a video

on:
  workflow_dispatch:
    inputs:
      product:
        description: "The product's notes to use (.makable-shorts/products/<name>.md), if there are several"
        required: false
      commits:
        description: "Commits to make it about: SHAs (in the product's code), repo@sha, commit URLs or a..b"
        required: false
      prompt:
        description: "Or, or as well: the functionality to show, in words"
        required: false
      tone:
        type: choice
        options: [friendly, hype]
        default: friendly
      language:
        type: choice
        options: [en, hi]
        default: en

permissions:
  contents: read
  id-token: write  # to sign in to Google Cloud with Workload Identity Federation, for Omni

concurrency:
  group: make-video  # one at a time: they'd share the product's account
  cancel-in-progress: false

jobs:
  video:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ secrets.PRODUCT_REPO_TOKEN || github.token }}  # gh api, for the commits
      HEYGEN_API_KEY: ${{ secrets.HEYGEN_API_KEY }}
      ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
      SHORTS_SPEECH_URL: ${{ secrets.SHORTS_SPEECH_URL }}
      SHORTS_SPEECH_KEY: ${{ secrets.SHORTS_SPEECH_KEY }}
      MAKABLE_SHORTS_REF: main  # the plugin's version: a branch or a tag of its repo
    steps:
      - name: Check what to make it about
        if: inputs.commits == '' && inputs.prompt == ''
        run: |
          echo "::error::Give commits, a prompt, or both"
          exit 1

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # every commit, for videos about older ones

      # Google Cloud's sign-in, for Omni, one way or the other: given both, the action fails. Each sets
      # GOOGLE_APPLICATION_CREDENTIALS and GOOGLE_CLOUD_PROJECT for the steps after it.
      - name: Google Cloud's sign-in, with Workload Identity Federation
        if: (vars.SHORTS_FILMER == '' || vars.SHORTS_FILMER == 'omni') && vars.GCP_WORKLOAD_IDENTITY_PROVIDER != ''
        uses: google-github-actions/auth@v2
        with:
          project_id: ${{ vars.GOOGLE_CLOUD_PROJECT }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Google Cloud's sign-in, with a service account's key
        if: (vars.SHORTS_FILMER == '' || vars.SHORTS_FILMER == 'omni') && vars.GCP_WORKLOAD_IDENTITY_PROVIDER == ''
        uses: google-github-actions/auth@v2
        with:
          project_id: ${{ vars.GOOGLE_CLOUD_PROJECT }}
          credentials_json: ${{ secrets.GOOGLE_CREDENTIALS }}

      - name: Keep the sign-in out of the checkout, where Claude reads the product's code
        if: env.GOOGLE_APPLICATION_CREDENTIALS != ''
        run: |
          moved="$RUNNER_TEMP/$(basename "$GOOGLE_APPLICATION_CREDENTIALS")"
          mv "$GOOGLE_APPLICATION_CREDENTIALS" "$moved"
          for name in GOOGLE_APPLICATION_CREDENTIALS CLOUDSDK_AUTH_CREDENTIAL_FILE_OVERRIDE GOOGLE_GHA_CREDS_PATH; do
            echo "$name=$moved" >> "$GITHUB_ENV"
          done

      - uses: astral-sh/setup-uv@v10

      - name: ffmpeg
        run: sudo apt-get update -q && sudo apt-get install -y -q ffmpeg

      - name: The plugin, its command, and Chromium for browser-use
        run: |
          # Outside the repo, so Claude's searches of the product's code never land in the plugin's
          git clone -q --depth 1 --branch "$MAKABLE_SHORTS_REF" https://github.com/Bhaveshupadhyay/makable-ai-video "$RUNNER_TEMP/makable-shorts"
          echo "$RUNNER_TEMP/makable-shorts/bin" >> "$GITHUB_PATH"   # makable-shorts makes its Python environments on first use
          echo "SHORTS_HOME=$RUNNER_TEMP/makable-shorts-home" >> "$GITHUB_ENV"   # the photo and the music go here
          uvx playwright install --with-deps chromium

      - name: The photo and the music
        env:
          FACE_URL: ${{ secrets.FACE_URL }}
          MUSIC_URL: ${{ secrets.MUSIC_URL }}
        run: |
          # Each is named for what it turns out to be: a link needn't end in its type (a share link, a query).
          fetch() {
            curl -fsSL "$2" -o "$RUNNER_TEMP/$1"
            case "$(file --mime-type -b "$RUNNER_TEMP/$1")" in
              image/png) type=png ;; image/jpeg) type=jpg ;; image/webp) type=webp ;;
              audio/mpeg) type=mp3 ;; audio/x-wav | audio/wav) type=wav ;; audio/x-m4a | audio/mp4 | video/mp4) type=m4a ;;
              *) echo "::error::$1's link isn't a photo or sound file ($(file -b "$RUNNER_TEMP/$1"))"; exit 1 ;;
            esac
            mv "$RUNNER_TEMP/$1" "$RUNNER_TEMP/$1.$type"
            makable-shorts me "--$1" "$RUNNER_TEMP/$1.$type"
          }
          if [ -n "$FACE_URL" ]; then fetch face "$FACE_URL"; fi  # an avatar video needs it: the skill says so
          if [ -n "$MUSIC_URL" ]; then fetch music "$MUSIC_URL"; fi

      - name: Who films you and who speaks
        env:
          FILMER: ${{ vars.SHORTS_FILMER || 'omni' }}
          FILMER_VOICE: ${{ vars.SHORTS_FILMER_VOICE }}
          NARRATOR: ${{ vars.SHORTS_NARRATOR || 'elevenlabs' }}
          KOKORO_VOICE: ${{ vars.SHORTS_KOKORO_VOICE }}
        run: >-
          makable-shorts me --filmer "$FILMER" --narrator "$NARRATOR" ${FILMER_VOICE:+--filmer-voice "$FILMER_VOICE"}
          ${KOKORO_VOICE:+--kokoro-voice "$KOKORO_VOICE"}

      - name: Make the video (Claude Code, with the make-video skill)
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: >-
            Make a Short with the make-video skill. The request:
            ${{ inputs.product }} ${{ inputs.commits }} ${{ inputs.prompt && format('"{0}"', inputs.prompt) || '' }}
            --tone ${{ inputs.tone }} --language ${{ inputs.language }} --yes
          # What the skill runs. Recording and making the video take minutes: Bash may wait up to 30 for one.
          claude_args: >-
            --plugin-dir ${{ runner.temp }}/makable-shorts
            --allowedTools "Read,Write,Edit,Glob,Grep,Skill,Bash(makable-shorts:*),Bash(git show:*),Bash(git log:*),Bash(git diff:*),Bash(gh api:*),Bash(gh search code:*),Bash(git clone --depth 1:*),Bash(git -C:*),Bash(ffprobe:*),Bash(ls:*)"
          settings: '{"env": {"BASH_DEFAULT_TIMEOUT_MS": "1800000", "BASH_MAX_TIMEOUT_MS": "1800000"}}'

      - name: Say if the notes changed
        if: always()
        run: |
          if [ -n "$(git status --porcelain -- .makable-shorts/products)" ]; then
            echo "::notice::The product's notes changed (new recording tips): they're uploaded with the video, in products/, for you to commit"
          fi

      - name: Upload the video
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: video
          if-no-files-found: warn
          include-hidden-files: true  # .makable-shorts is a hidden folder
          path: |
            .makable-shorts/products/*.md
            .makable-shorts/runs/*/final.mp4
            .makable-shorts/runs/*/metadata.json
            .makable-shorts/runs/*/script.json
            .makable-shorts/runs/*/changes.md
            .makable-shorts/runs/*/footage/*.steps.json
            .makable-shorts/runs/*/recordings/*.browse.json
            .makable-shorts/runs/*/recordings/*.drive.log

      - name: Check a video was made
        if: always()  # the skill can stop without one (a recording that never showed the change), and still succeed
        run: |
          if ! find .makable-shorts/runs -path '.makable-shorts/runs/*/final.mp4' -size +0 2>/dev/null | grep -q .; then
            echo "::error::No video was made: see what Claude reported above, and the files uploaded with the run"
            exit 1
          fi
