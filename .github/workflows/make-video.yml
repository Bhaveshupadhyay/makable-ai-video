# Makes a Short about your product in GitHub Actions: Claude Code runs this repo as its plugin, and the plugin's
# make-video skill (skills/make-video) with --yes, so it asks nothing. It records the change by driving Chrome, writes the script, films the intro and the
# outro with Gemini Omni (about $2), has the voice API on Modal speak the narration, and uploads the video.
#
# Run it from the Actions tab (Make a video, Run workflow) or: gh workflow run make-video.yml -f commits=3f2a9c1
#
# Your product's notes come from this repo: commit them as .makable-shorts/products/<name>.md (the skill writes them
# in ~/.config/makable-shorts/products/ when you first make a video locally). Nobody can sign in by hand here, so
# the recordings are of what the product shows signed out.
#
# Repository secrets it needs:
#   CLAUDE_CODE_OAUTH_TOKEN    claude setup-token (your Claude subscription)
#   GEMINI_API_KEY             Omni (it needs a prepaid balance in AI Studio)
#   HEYGEN_API_KEY             (optional) to film with HeyGen instead (run.json's intro and outro)
#   SHORTS_SPEECH_URL, SHORTS_SPEECH_KEY    the voice API (services/voice/app.py), or ElevenLabs'
#   FACE_URL                   a link to your photo, for Omni (a secret holds at most 48 KB, too little for the photo)
#   MUSIC_URL                  (optional) a link to music to play under the video

name: Make a video

on:
  workflow_dispatch:
    inputs:
      product:
        description: "The product's notes to use (.makable-shorts/products/<name>.md), if there are several"
        required: false
      commits:
        description: "Commits to make it about: SHAs (in the product's code), repo@sha, commit URLs or a..b"
        required: false
      prompt:
        description: "Or, or as well: the functionality to show, in words"
        required: false
      tone:
        type: choice
        options: [friendly, hype]
        default: friendly
      language:
        type: choice
        options: [en, hi]
        default: en

permissions:
  contents: read

concurrency:
  group: make-video  # one at a time: they'd share the product's account
  cancel-in-progress: false

jobs:
  video:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}  # gh api, for the commits
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      HEYGEN_API_KEY: ${{ secrets.HEYGEN_API_KEY }}
      SHORTS_SPEECH_URL: ${{ secrets.SHORTS_SPEECH_URL }}
      SHORTS_SPEECH_KEY: ${{ secrets.SHORTS_SPEECH_KEY }}
      SHORTS_HOME: ${{ github.workspace }}/.makable-shorts  # the product's notes; the photo and the music go here
    steps:
      - name: Check what to make it about
        if: inputs.commits == '' && inputs.prompt == ''
        run: |
          echo "::error::Give commits, a prompt, or both"
          exit 1

      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10

      - name: ffmpeg
        run: sudo apt-get update -q && sudo apt-get install -y -q ffmpeg

      - name: The plugin's command, and Chromium for browser-use
        run: |
          echo "$GITHUB_WORKSPACE/bin" >> "$GITHUB_PATH"   # makable-shorts makes its Python environments on first use
          uvx playwright install --with-deps chromium

      - name: The photo and the music
        env:
          FACE_URL: ${{ secrets.FACE_URL }}
          MUSIC_URL: ${{ secrets.MUSIC_URL }}
        run: |
          mkdir -p "$SHORTS_HOME/me"
          curl -fsSL "$FACE_URL" -o "$SHORTS_HOME/me/face.${FACE_URL##*.}"
          if [ -n "$MUSIC_URL" ]; then curl -fsSL "$MUSIC_URL" -o "$SHORTS_HOME/me/music.${MUSIC_URL##*.}"; fi

      - name: Make the video (Claude Code, with the make-video skill)
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: >-
            Make a Short with the make-video skill. The request:
            ${{ inputs.product }} ${{ inputs.commits }} ${{ inputs.prompt && format('"{0}"', inputs.prompt) || '' }}
            --tone ${{ inputs.tone }} --language ${{ inputs.language }} --yes
          # What the skill runs. Recording and making the video take minutes: Bash may wait up to 30 for one.
          claude_args: >-
            --plugin-dir ${{ github.workspace }}
            --allowedTools "Read,Write,Edit,Glob,Grep,Skill,Bash(makable-shorts:*),Bash(gh api:*),Bash(gh search code:*),Bash(git clone --depth 1:*),Bash(git -C:*),Bash(ffprobe:*),Bash(ls:*)"
          settings: '{"env": {"BASH_DEFAULT_TIMEOUT_MS": "1800000", "BASH_MAX_TIMEOUT_MS": "1800000"}}'

      - name: Upload the video
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: video
          if-no-files-found: warn
          path: |
            runs/*/final.mp4
            runs/*/metadata.json
            runs/*/script.json
            runs/*/changes.md
            runs/*/task.md
            runs/*/footage/*.steps.json
            runs/*/recordings/*.browse.json
            runs/*/recordings/*.drive.log

      - name: Check a video was made
        if: always()  # the skill can stop without one (a recording that never showed the change), and still succeed
        run: |
          if ! find runs -path 'runs/*/final.mp4' -size +0 2>/dev/null | grep -q .; then
            echo "::error::No video was made: see what Claude reported above, and the files uploaded with the run"
            exit 1
          fi
