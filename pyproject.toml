[project]
name = "makable-shorts"
version = "0.2.0"
description = "1-minute videos about makable, made by stages that share a run folder"
readme = "README.md"
requires-python = ">=3.12"
# The orchestrator, the run folder, record, take-voice and the import stage. Each other stage's packages are an
# extra of its own, so a machine installs only what the stages it runs need; ffmpeg comes from the system.
dependencies = ["pydantic>=2"]

[project.optional-dependencies]
browse = ["browser-use==0.13.11"]                          # python -m shorts browse: in an environment of its own
gemini = ["google-genai"]                                  # film-intro, film-outro (Gemini Omni)
assemble = ["pillow"]                                      # assemble: the captions
speech = ["httpx"]                                         # speak (the voice API on Modal, or ElevenLabs)
dev = ["pytest", "ruff", "fastapi", "python-multipart", "httpx"]  # and services/voice's API, for its tests

[project.scripts]
shorts = "shorts.__main__:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["shorts*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
