[project]
name = "makable-shorts"
version = "0.3.0"
description = "1-minute product demo videos, made by stages that share a run folder"
readme = "README.md"
requires-python = ">=3.12"
# The orchestrator, the run folder, record, take-voice and the import stage. Each other stage's packages are an
# extra of its own, so a machine installs only what the stages it runs need; ffmpeg comes from the system.
dependencies = ["pydantic>=2"]

[project.optional-dependencies]
browse = ["browser-use==0.13.11", "pillow"]                # drive and signin's Chrome: in an environment of its own
gemini = ["google-genai>=2.33"]                            # film-intro, film-outro (Gemini Omni, on Google Cloud)
heygen = ["httpx"]                                         # film-intro, film-outro with HeyGen
assemble = ["pillow"]                                      # assemble: the captions
speech = ["httpx"]                                         # speak (ElevenLabs, or your voice API on Modal), deploy-voice
# speak with Kokoro, on this machine: in an environment of its own (torch). Its English needs spaCy's small model,
# which isn't on PyPI.
kokoro = [
    "kokoro>=0.9.4",
    "soundfile",
    "en-core-web-sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl",
]
dev = ["pytest", "ruff", "fastapi", "python-multipart", "httpx"]  # and services/voice's API, for its tests

[project.scripts]
shorts = "shorts.__main__:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["shorts*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
